# Dựa trên docker-compose.production.yaml chính thức của Chatwoot.
# Khác bản gốc: pin version, cổng cấu hình được, postgres/redis đọc mật khẩu từ .env,
# và tạo thêm database `zalo_bridge` cho zalo-bridge (xem postgres-init/).
# Không thêm `extra_hosts: host.docker.internal:host-gateway`: nó tạo thêm bản ghi IPv6 trong /etc/hosts,
# Ruby chọn IPv6 trước và webhook tới bridge trên host bị "Network unreachable". DNS của Docker Desktop
# đã tự phân giải host.docker.internal ra IPv4.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0}
  env_file: .env
  volumes:
    - storage_data:/app/storage
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  rails:
    <<: *chatwoot
    ports:
      - '127.0.0.1:${CHATWOOT_HOST_PORT:-3100}:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *chatwoot
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
